spring:
  application:
    name: freedom-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/freedom
    username: freedom
    password: freedom

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

server:
  port: 8080

app:
  jwt:
    secret: "freedom-dev-secret-key-change-me-before-production-2026-super-secret"
    expiration-minutes: 60

  market:
    gold-api-base-url: "https://api.gold-api.com"
    fx-api-base-url: "https://api.frankfurter.dev"
    cache-minutes: 10

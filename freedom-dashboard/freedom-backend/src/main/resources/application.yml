spring:
  application:
    name: freedom-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/freedom
    username: freedom
    password: freedom

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

server:
  port: 8080

app:
  jwt:
    secret: "freedom-dev-secret-key-change-me-before-production-2026-super-secret"
    expiration-minutes: 60

  market:
    gold-api-base-url: "https://api.gold-api.com"
    fx-api-base-url: "https://api.frankfurter.dev"
    cache-minutes: 10
    real-estate-api-base-url: "https://api.mscanner.pl/api"
    real-estate-cache-minutes: 60
    coingecko-api-base-url: "https://api.coingecko.com/api/v3"
    coingecko-demo-api-key: "${COINGECKO_DEMO_API_KEY:}"
    crypto-cache-minutes: 10
    nbp-api-base-url: "https://api.nbp.pl/api"
    fx-cash-cache-minutes: 60
